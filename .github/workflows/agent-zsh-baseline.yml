name: Agent zsh command-chain baseline
on:
  push:
    branches: [proof/agent-zsh-baseline-126521]
permissions:
  contents: read
jobs:
  reproduce:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.21.0'
          install-bun: 'false'
          cache-mode: read-write
      - name: Reproduce through production host-exec preparation
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > .proof/source-sha.txt
          node --import ./scripts/tsx.mjs .proof/zsh-exec-baseline.mts | tee .proof/zsh-baseline.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: agent-zsh-baseline
          path: .proof/
          include-hidden-files: true
