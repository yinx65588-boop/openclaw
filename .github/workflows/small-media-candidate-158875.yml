name: Remote runner readiness
on:
  push:
    branches: [proof/small-remote-readiness-20261023]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Confirm isolated runner capacity
        shell: bash
        run: |
          set -euo pipefail
          printf 'Remote Actions runner started successfully\n'
          uname -srm
          nproc
          free -m
          node --version
