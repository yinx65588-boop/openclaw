name: TTS paragraph baseline proof
on:
  push:
    branches: [proof/small-tts-baseline-181070-20261023]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENCLAW_VITEST_RUNTIME: node
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.22.1'
          install-bun: 'false'
          cache-mode: restore
      - uses: ./.github/actions/setup-test-bun
      - name: Reproduce duplicate caption through reply dispatch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .proof
          git rev-parse HEAD > .proof/source.txt
          set +e
          pnpm test src/auto-reply/reply/dispatch-from-config.tts-stream.test.ts --maxWorkers=1 -t 'delivers a captioned final answer once' --reporter=json --outputFile=.proof/baseline.json > .proof/baseline.log 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > .proof/baseline-exit.txt
          cat .proof/baseline.log
          test "$result" -eq 1
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const report = JSON.parse(fs.readFileSync('.proof/baseline.json', 'utf8'));
          assert.equal(report.numFailedTests, 1);
          const failed = report.testResults.flatMap(f => f.assertionResults).filter(t => t.status === 'failed');
          assert.equal(failed.length, 1);
          assert.ok(failed[0].fullName.includes('delivers a captioned final answer once'));
          const message = failed[0].failureMessages.join('\n');
          assert.ok(message.includes('expected') && message.includes('First paragraph.') && message.includes('FIN'));
          console.log('Baseline failed at the final caption assertion.');
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: tts-paragraph-baseline-181070
          path: .proof
          include-hidden-files: true
