name: Agent thinking reload changed-file checks
on: push
permissions:
  contents: read
jobs:
  reproduce:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENCLAW_VITEST_RUNTIME: bun
      OPENCLAW_TEST_FILE_LOG: '1'
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          install-bun: 'false'
          cache-mode: restore
          semantic-checks: 'true'
      - uses: ./.github/actions/setup-test-bun
      - name: Run OpenClaw changed-file checks
        run: |
          test "$(git rev-parse HEAD^)" = "398e258269a37d4883477aa60702704e92f8ae23"
          git diff --check HEAD^ HEAD
          pnpm check:changed -- src/gateway/operator-model-presentation.ts src/gateway/operator-model-presentation.test.ts
