name: ACP session directory public CLI proof
on:
  push:
    branches: [proof/acp-session-cwd-123557]
permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=6144
  BASE_SOURCE: fecdb0fb6aa265dba8cb6277bb5f190079debad7
jobs:
  cli:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.21.0'
          install-bun: 'false'
          cache-mode: restore
      - name: Build and exercise the unchanged baseline through public ACP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .proof
          git fetch --no-tags --depth=1 origin "$BASE_SOURCE"
          git rev-parse HEAD > .proof/proof-source.txt
          cp src/acp/translator.session-lifecycle.ts "$RUNNER_TEMP/acp-cwd-repair.ts"
          git show "$BASE_SOURCE:src/acp/translator.session-lifecycle.ts" > src/acp/translator.session-lifecycle.ts
          git diff --exit-code "$BASE_SOURCE" -- src/acp/translator.session-lifecycle.ts
          git config user.name yinx65588-boop
          git config user.email 272180046+yinx65588-boop@users.noreply.github.com
          git add src/acp/translator.session-lifecycle.ts
          git -c core.hooksPath=/dev/null commit -m 'test: select exact baseline source for CLI proof'
          pnpm build:ci-artifacts > .proof/build-baseline.log 2>&1
          ACP_CWD_BASELINE=1 node --import ./scripts/tsx.mjs .proof/acp-cwd-cli-proof.mjs | tee .proof/cli-baseline.log
      - name: Build and exercise the repaired source through public ACP
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/acp-cwd-repair.ts" src/acp/translator.session-lifecycle.ts
          git diff --exit-code "$(cat .proof/proof-source.txt)" -- src/acp/translator.session-lifecycle.ts
          git add src/acp/translator.session-lifecycle.ts
          git -c core.hooksPath=/dev/null commit -m 'test: restore exact repaired source for CLI proof'
          pnpm build:ci-artifacts > .proof/build-repair.log 2>&1
          node --import ./scripts/tsx.mjs .proof/acp-cwd-cli-proof.mjs | tee .proof/cli-repair.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: acp-cwd-public-cli-proof
          path: .proof/
          include-hidden-files: true
