name: ACP session directory regression proof
on:
  push:
    branches: [proof/acp-session-cwd-123557]
permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=6144
jobs:
  boundary:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.21.0'
          install-bun: 'false'
          cache-mode: restore
      - name: Run repaired boundary and existing ACP/workspace contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .proof
          git rev-parse HEAD > .proof/proof-source.txt
          node scripts/run-vitest.mjs src/gateway/server.acp-session-cwd.test.ts src/acp/translator.session-setup.test.ts src/gateway/server.sessions.create.workspace-policy.test.ts --maxWorkers=1 2>&1 | tee .proof/repaired-tests.log
      - name: Check changed owners and type graphs
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-format.mts --check src/acp/translator.session-lifecycle.ts src/gateway/server.acp-session-cwd.test.ts docs/cli/acp.md 2>&1 | tee .proof/format.log
          node scripts/run-oxlint.mjs --tsconfig tsconfig.core.json src/acp/translator.session-lifecycle.ts 2>&1 | tee .proof/lint-source.log
          node scripts/run-oxlint.mjs --tsconfig test/tsconfig/tsconfig.core.test.gateway-server.json src/gateway/server.acp-session-cwd.test.ts 2>&1 | tee .proof/lint-test.log
          node scripts/run-tsgo.mjs -p tsconfig.core.json 2>&1 | tee .proof/types-production.log
          node scripts/run-tsgo.mjs -p test/tsconfig/tsconfig.core.test.gateway-server.json 2>&1 | tee .proof/types-tests.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: acp-cwd-boundary-proof
          path: .proof/
          include-hidden-files: true
