name: ACP inherited mock export guard comparison
on:
  push:
    branches: [proof/acp-session-cwd-123557]
permissions:
  contents: read
env:
  CI_BASE: d5aeceb2b89e253ba15d41976d0618e31842fb48
  CI_TARGET: c5d6eefd1b03800e8709f7c037087f7f59ddc8f7
jobs:
  compare:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.21.0'
          install-bun: 'false'
          cache-mode: restore
      - name: Compare the exact failed guard on base and CI merge
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/acp-mock-export-comparison"
          mkdir -p "$evidence"
          git fetch --no-tags --depth=1 origin "$CI_BASE" "$CI_TARGET"
          git diff --exit-code "$CI_BASE" "$CI_TARGET" -- test/scripts/ci-node-test-plan.test.ts scripts/check-test-mock-exports.mts config/test-mock-exports-baseline.txt
          for variant in base merge; do
            if [ "$variant" = base ]; then target="$CI_BASE"; else target="$CI_TARGET"; fi
            git checkout --detach "$target"
            set +e
            node --import ./scripts/tsx.mjs scripts/check-test-mock-exports.mts --base "$CI_BASE" --no-merge-base > "$evidence/$variant.log" 2>&1
            result=$?
            set -e
            printf '%s\n' "$result" > "$evidence/$variant.exit-code"
            cat "$evidence/$variant.log"
            test "$result" -eq 1
          done
          diff -u "$evidence/base.log" "$evidence/merge.log"
          printf 'Exact base %s and CI merge %s fail identically.\n' "$CI_BASE" "$CI_TARGET" | tee "$evidence/result.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: acp-inherited-mock-export-comparison
          path: ${{ runner.temp }}/acp-mock-export-comparison/
