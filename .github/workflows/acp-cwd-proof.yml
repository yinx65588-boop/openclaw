name: ACP refreshed head public CLI proof
on:
  push:
    branches: [proof/acp-session-cwd-123557]
permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=6144
  REVIEWED_HEAD: 9ddbdddef829d4bbab201bb3ce92af897afd5279
jobs:
  cli:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.21.0'
          install-bun: 'false'
          cache-mode: restore
      - name: Verify exact PR source and exercise built public ACP
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$REVIEWED_HEAD"
          git diff --exit-code "$REVIEWED_HEAD" HEAD -- . ':!.github/workflows/acp-cwd-proof.yml' ':!.proof/acp-cwd-cli-proof.mjs'
          mkdir -p .proof
          git rev-parse "$REVIEWED_HEAD" > .proof/reviewed-head.txt
          pnpm build:ci-artifacts > .proof/build-refreshed-head.log 2>&1
          node --import ./scripts/tsx.mjs .proof/acp-cwd-cli-proof.mjs | tee .proof/cli-refreshed-head.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: acp-cwd-refreshed-head-public-cli
          path: .proof/
          include-hidden-files: true
