name: Agent validation warning proof
on:
  push:
    branches: [proof/agent-validation-176066]
  workflow_dispatch:
permissions:
  contents: read
env:
  OPENCLAW_VITEST_RUNTIME: node
  NODE_OPTIONS: --max-old-space-size=6144
  PROOF_BASE: 89207ad525fc581f59eaa6ed8c999474cb78b376
jobs:
  proof:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.21.0'
          install-bun: 'false'
          cache-mode: read-write
      - name: Record source and selected scope
        run: |
          mkdir -p .proof
          git rev-parse HEAD | tee .proof/source-sha.txt
          git diff --name-only "$PROOF_BASE" HEAD -- src | tee .proof/changed-files.txt
          git ls-tree HEAD src/agents/embedded-agent-runner/run/tool-error-warning.ts src/agents/embedded-agent-runner/run/tool-error-warning.test.ts src/agents/tool-terminal-outcome.test.ts > .proof/source-blobs.txt
          node scripts/check-changed.mjs --dry-run -- $(cat .proof/changed-files.txt) > .proof/selected-checks.log 2>&1
      - name: Reproduce original warnings with identical regressions
        shell: bash
        run: |
          cp src/agents/embedded-agent-runner/run/tool-error-warning.ts .proof/fixed-tool-error-warning.ts
          git restore --source="$PROOF_BASE" --worktree -- src/agents/embedded-agent-runner/run/tool-error-warning.ts
          set +e
          pnpm test src/agents/tool-terminal-outcome.test.ts src/agents/embedded-agent-runner/run/tool-error-warning.test.ts --maxWorkers=1 --reporter=json --outputFile=.proof/baseline.json > .proof/baseline.log 2>&1
          result=$?
          set -e
          cp .proof/fixed-tool-error-warning.ts src/agents/embedded-agent-runner/run/tool-error-warning.ts
          echo "$result" > .proof/baseline.status
          node --input-type=module <<'JS' | tee .proof/baseline-summary.log
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const report=JSON.parse(fs.readFileSync('.proof/baseline.json','utf8'));
          const failed=report.testResults.flatMap(s=>s.assertionResults??[]).filter(a=>a.status==='failed');
          console.log(JSON.stringify({failed:report.numFailedTests,passed:report.numPassedTests,failures:failed.map(a=>({name:a.fullName,messages:a.failureMessages}))},null,2));
          assert.equal(report.numFailedTests,4);
          assert(failed.every(a=>a.fullName.includes('validation errors')||a.fullName.includes('describes invalid arguments through the agent subscription')));
          assert(failed.some(a=>a.fullName.includes('describes invalid arguments through the agent subscription')));
          assert.equal(fs.readFileSync('.proof/baseline.status','utf8').trim(),'1');
          JS
      - name: Verify repaired tool pipeline and related owners
        if: ${{ !cancelled() }}
        run: |
          /usr/bin/time -v -o .proof/repaired-time.log pnpm test src/agents/tool-terminal-outcome.test.ts src/agents/embedded-agent-runner/run/tool-error-warning.test.ts src/agents/embedded-agent-subscribe.handlers.tools.test.ts src/agents/agent-tools.schema.test.ts --maxWorkers=1 --reporter=json --outputFile=.proof/repaired.json > .proof/repaired.log 2>&1
          node --input-type=module <<'JS' | tee .proof/repaired-summary.log
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const report=JSON.parse(fs.readFileSync('.proof/repaired.json','utf8'));
          console.log(JSON.stringify({failed:report.numFailedTests,passed:report.numPassedTests,files:report.testResults.map(t=>({name:t.name,status:t.status,ms:t.endTime-t.startTime}))},null,2));
          assert.equal(report.numFailedTests,0);
          JS
      - name: Core production types and changed test graph
        if: ${{ !cancelled() }}
        run: |
          node scripts/run-tsgo.mjs -p tsconfig.core.json --incremental --tsBuildInfoFile .artifacts/tsgo-cache/core.tsbuildinfo > .proof/types-production.log 2>&1
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          fs.writeFileSync('.proof/tsconfig.validation-tests.json',JSON.stringify({
            extends:'../test/tsconfig/tsconfig.core.test.shard.json',
            compilerOptions:{tsBuildInfoFile:'../.artifacts/tsgo-cache/validation-tests.tsbuildinfo'},
            include:['../test/types/vitest-codex-attempt-runtime.d.ts','../src/**/*.d.ts','../ui/**/*.d.ts','../extensions/**/*.d.ts','../packages/**/*.d.ts','../src/agents/tool-terminal-outcome.test.ts','../src/agents/embedded-agent-runner/run/tool-error-warning.test.ts']
          }));
          JS
          node scripts/run-tsgo.mjs -p .proof/tsconfig.validation-tests.json --incremental > .proof/types-tests.log 2>&1
      - name: Changed-file lint, format and line budget
        if: ${{ !cancelled() }}
        run: |
          node scripts/run-oxlint.mjs --tsconfig tsconfig.json --threads=1 $(cat .proof/changed-files.txt) > .proof/lint.log 2>&1
          pnpm exec oxfmt --check $(cat .proof/changed-files.txt) > .proof/format.log 2>&1
          node --import ./scripts/tsx.mjs scripts/check-line-cap-ratchet.mts --base "$PROOF_BASE" > .proof/line-cap.log 2>&1
          git diff --check "$PROOF_BASE" HEAD
      - name: Upload evidence including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: agent-validation-proof
          path: .proof/
          include-hidden-files: true
