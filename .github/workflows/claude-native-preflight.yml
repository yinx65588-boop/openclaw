name: Claude native parser-overflow proof preflight
on: push
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install unmodified public Claude CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/claude-native" --no-audit --no-fund @anthropic-ai/claude-code@2.1.311
          "$RUNNER_TEMP/claude-native/node_modules/.bin/claude" --version
      - name: Exercise native transcript resume over loopback-only HTTP
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proof-home"
          sudo env -i "PATH=$PATH" "HOME=$RUNNER_TEMP/proof-home" \
            "PROOF_CLAUDE=$RUNNER_TEMP/claude-native/node_modules/.bin/claude" \
            unshare --net --fork bash -c 'ip link set lo up; runuser -u runner --preserve-environment -- node .proof/claude-native-preflight.mjs'
