name: Agent fallback accounting CLI proof
on:
  push:
    branches: [proof/agent-fallback-127381]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  cli:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d3dda7a364c07daa57f6762c637f38cc49fe8de1
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      - name: Locked dependencies for the same reviewed source
        uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.21.0'
          install-bun: 'false'
          cache-mode: read-write
      - name: Fetch corrected provider fixture
        id: tools
        run: |
          mkdir -p .proof
          curl --fail --silent --show-error "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/.proof/agent-fallback-cli-proof.mjs" -o "$RUNNER_TEMP/agent-fallback-cli-proof.mjs"
          git rev-parse HEAD > .proof/source.log
      - name: Prepare CLI through its supported runtime build owner
        run: pnpm --silent openclaw --version > .proof/runtime-bootstrap.log 2>&1
      - name: Native malformed-tool completion fallback and persisted accounting
        run: node "$RUNNER_TEMP/agent-fallback-cli-proof.mjs"
      - name: Upload CLI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: agent-fallback-cli-proof
          path: |
            .proof/*.log
            .proof/*.json
          include-hidden-files: true
