name: PR176119 fixture formatting
on:
  push:
    branches: [proof/zsh-fixtures-format-20261023]
permissions:
  contents: read
jobs:
  format:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: eb7382ee019cd2866265d6371342d2e4a1cd2153
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.22.1'
          install-bun: 'false'
          cache-mode: restore
      - name: Check final candidate format
        run: |
          set -euo pipefail
          mkdir -p .proof
          printf '%s' '' | base64 -d > .proof/candidate.patch
          git apply --check .proof/candidate.patch
          git apply .proof/candidate.patch
          git diff --check
          node scripts/run-format.mts --check extensions/feishu/src/http.test-support.ts extensions/feishu/src/app-registration.test.ts extensions/feishu/src/streaming-card.test.ts src/gateway/session-message-events.exec-completion.test.ts 2>&1 | tee .proof/format.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: final-fixture-format-20261023
          path: .proof/
          include-hidden-files: true
