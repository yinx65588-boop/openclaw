name: Retained skill catalogs real SSH repaired proof
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=8192
jobs:
  ssh:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        access: [none, ro, rw]
    env:
      SOURCE_SHA: 4b85835fc16692ebc86b491913b1f6f989df7a79
      WORKSPACE_ACCESS: ${{ matrix.access }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4b85835fc16692ebc86b491913b1f6f989df7a79
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.22.1'
          install-bun: 'false'
          cache-mode: restore
          semantic-checks: 'true'
      - name: Record exact baseline source
        run: |
          set -euo pipefail
          mkdir -p .proof
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git rev-parse HEAD > .proof/source-head.txt
          command -v /usr/sbin/sshd
          ssh -V 2> .proof/ssh-version.txt
          : > .proof/cli.b64
      - name: Stage controlled fixture part 1
        run: |
          printf '%s' '' >> .proof/cli.b64
      - name: Stage controlled fixture part 2
        run: |
          printf '%s' '' >> .proof/cli.b64
      - name: Decode controlled SSH fixture
        run: |
          set -euo pipefail
          base64 --decode .proof/cli.b64 > .proof/cli.py
          sha256sum .proof/cli.py > .proof/fixture-sha256.txt
          cat > .proof/netproof.sh <<'SH'
          set -euo pipefail
          mount --make-rprivate /
          ip link set lo up
          test -z "$(ip -4 route show default)"
          test -z "$(ip -6 route show default)"
          python3 .proof/cli.py
          SH
      - name: Stage reviewed repair patch
        run: |
          : > .proof/candidate.patch.b64
      - name: Stage repair patch part 1
        run: |
          printf '%s' '' >> .proof/candidate.patch.b64
      - name: Stage repair patch part 2
        run: |
          printf '%s' '' >> .proof/candidate.patch.b64
      - name: Apply reviewed repair patch
        run: |
          base64 --decode .proof/candidate.patch.b64 > .proof/candidate.patch
          printf '%s\n' '7ad69f47699de518c7494319d065d4bf4733f7b1eb90580acdae55ec9578f23c  .proof/candidate.patch' | sha256sum --check
          git apply --check .proof/candidate.patch
          git apply .proof/candidate.patch
          git diff --check
          git diff --binary > .proof/tested.patch
          git status --short > .proof/changed-files.txt
      - name: Build shipped CLI
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee .proof/build.log
      - name: Repaired reused SSH workspace and retained catalog reads
        run: |
          set -uo pipefail
          sudo env -i "PATH=$PATH" "COREPACK_HOME=$COREPACK_HOME" "NODE_OPTIONS=$NODE_OPTIONS" "PROOF_ROOT=$PWD/.proof/cli" "SOURCE_SHA=$SOURCE_SHA" "WORKSPACE_ACCESS=$WORKSPACE_ACCESS" unshare --mount --net --fork bash .proof/netproof.sh 2>&1 | tee .proof/cli.log
          original_exit=${PIPESTATUS[0]}
          printf '%s\n' "$original_exit" > .proof/original-exit.txt
          sudo python3 - "$WORKSPACE_ACCESS" "$original_exit" <<'PY'
          import json,sys
          from pathlib import Path
          access,exit_code=sys.argv[1],int(sys.argv[2])
          result=json.loads(Path('.proof/cli/result.json').read_text())
          assert not result['fixtureFailures'], result
          assert result['toolReads']['PRIME']['matched'], 'SSH prime/auth setup did not succeed'
          assert result['bCompletedBeforeAReleased'] and result['remoteCanonicalSentinelPreserved'], result
          assert len(result['runtimeRoots']) == 1 and len(result['toolReads']) == 3, result
          assert exit_code == 0 and result['passed'], result
          assert len(result['hostCatalogs']) == 3 and all(value['expectedBytesVerified'] for value in result['hostCatalogs'].values()), result
          assert all(value['matched'] for value in result['toolReads'].values()), result
          assert all(value['exit'] == 0 for value in result['sshReads'].values()), result
          print('PASS: all catalogs delivered over actual SSH; A survived B completion; unrelated remote state preserved')
          PY
      - name: Make controlled evidence readable
        if: always()
        run: |
          mkdir -p .proof/published
          for file in .proof/cli/*.log .proof/cli/result.json; do
            if sudo test -f "$file"; then sudo install -m 0644 "$file" ".proof/published/$(basename "$file")"; fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: sandbox-skills-ssh-repaired-${{ matrix.access }}
          path: |
            .proof/published/
            .proof/build.log
            .proof/cli.log
            .proof/cli.py
            .proof/source-head.txt
            .proof/fixture-sha256.txt
            .proof/ssh-version.txt
            .proof/original-exit.txt
            .proof/candidate.patch
            .proof/tested.patch
            .proof/changed-files.txt
          include-hidden-files: true
