name: Retained SSH catalogs focused repair validation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=8192
jobs:
  focused:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4b85835fc16692ebc86b491913b1f6f989df7a79
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.22.1'
          install-bun: 'false'
          cache-mode: restore
          semantic-checks: 'true'
      - uses: ./.github/actions/setup-test-bun
      - name: Prepare frozen patch
        run: mkdir -p .proof
      - name: Stage patch part 1
        run: |
          printf '%s' '' >> .proof/input.b64
      - name: Stage patch part 2
        run: |
          printf '%s' '' >> .proof/input.b64
      - name: Apply and format current repair
        run: |
          base64 -d .proof/input.b64 > .proof/input.patch
          git apply .proof/input.patch
          mapfile -t changed < <(git diff --name-only)
          pnpm exec oxfmt --write "${changed[@]}"
          git diff --check
          git diff --binary > .proof/formatted.patch
      - name: Remote delivery, bootstrap, cancellation and SSH adapter regressions
        run: |
          set -o pipefail
          node scripts/test-projects.mts src/agents/sandbox/remote-shell-backend.test.ts src/agents/sandbox/ssh-backend.test.ts --maxWorkers=1 --reporter=default 2>&1 | tee .proof/remote.log
      - name: Publication and context consumer regressions
        if: always()
        run: |
          set -o pipefail
          node scripts/test-projects.mts src/agents/sandbox.resolveSandboxContext.test.ts src/agents/embedded-agent-runner/sandbox-skills.test.ts src/skills/loading/workspace-skill-sync.runtime.test.ts src/skills/loading/workspace-skill-sync.custody.test.ts --maxWorkers=1 --reporter=default 2>&1 | tee .proof/consumers.log
      - name: Production types
        if: always()
        run: |
          set -o pipefail
          node scripts/run-tsgo.mjs -p tsconfig.core.json --noEmit 2>&1 | tee .proof/core-types.log
      - name: Agent test types
        if: always()
        run: |
          set -o pipefail
          node scripts/run-tsgo.mjs -p test/tsconfig/tsconfig.core.test.agents-other.json --noEmit 2>&1 | tee .proof/agent-test-types.log
      - name: Skills test types
        if: always()
        run: |
          set -o pipefail
          node scripts/run-tsgo.mjs -p test/tsconfig/tsconfig.core.test.other.json --noEmit 2>&1 | tee .proof/skills-test-types.log
      - name: Changed owner lint and format
        if: always()
        run: |
          set -o pipefail
          node scripts/run-oxlint.mjs --openclaw-focused-config config/tsconfig/oxlint.core.json src/agents/sandbox/backend.types.ts src/agents/sandbox/context.ts src/agents/sandbox/remote-shell-backend.ts src/agents/sandbox/remote-shell-backend.test.ts src/skills/loading/workspace-skill-sync.runtime.ts 2>&1 | tee .proof/lint.log
          mapfile -t changed < <(git diff --name-only)
          pnpm exec oxfmt --check "${changed[@]}"
      - name: Mock export and line cap guards
        if: always()
        run: |
          set -o pipefail
          pnpm check:test-mock-exports 2>&1 | tee .proof/mock-exports.log
          node scripts/check-line-cap-ratchet.mjs --base 4b85835fc16692ebc86b491913b1f6f989df7a79 --no-merge-base 2>&1 | tee .proof/line-cap.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: sandbox-remote-focused-20261024
          path: .proof
          include-hidden-files: true
