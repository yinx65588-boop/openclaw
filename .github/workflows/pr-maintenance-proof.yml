name: PR176119 OpenAI baseline comparison
on:
  push:
    branches: [proof/zsh-openai-comparison-20261022]
permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=6144
jobs:
  comparison:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: base
            source: 62fcd8cc13df1dcaad686e915f6b393c48e75607
          - label: merge
            source: d78fbf7450bd0619f0d1011a3a30b48931fb53b1
    env:
      OPENCLAW_CI_TEST_RUNTIME_POLICY: bun-all
      OPENCLAW_VITEST_MAX_WORKERS: '2'
      OPENCLAW_NODE_TEST_PLAN_CONCURRENCY: '1'
      OPENCLAW_NODE_TEST_GROUPS_GZIP_BASE64: 
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.22.1'
          install-bun: 'false'
          cache-mode: restore
      - uses: ./.github/actions/setup-test-bun
      - name: Capture original ordered openai group and original exit code
        shell: bash
        env:
          EXPECTED_SOURCE: ${{ matrix.source }}
        run: |
          set -euo pipefail
          mkdir -p .proof
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          git rev-parse HEAD > .proof/source.txt
          set +e
          node --import ./scripts/tsx.mjs scripts/ci-run-node-test-shard.mts 2>&1 | tee .proof/original-openai-group.log
          result=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$result" > .proof/original-exit.txt
          echo "Original openai test group exit: $result"
          test -s .proof/original-openai-group.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: zsh-openai-comparison-${{ matrix.label }}-20261022
          path: .proof/
          include-hidden-files: true
