name: Session conflict HTTP repaired proof
on:
  push:
    branches: [proof/session-conflict-candidate-20261104]
permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=8192
  OPENCLAW_VITEST_RUNTIME: bun
jobs:
  repaired:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ca4cf041fc3b0f2d2bd6d39ecdfbe8899f9e5754
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.22.1'
          install-bun: 'false'
          cache-mode: restore
          semantic-checks: 'true'
      - uses: ./.github/actions/setup-test-bun
      - name: Apply focused repair and capture canonical formatted source
        run: |
          mkdir -p .proof/formatted/src/gateway .proof/formatted/docs/gateway .proof/formatted/config/test-lines-allocations
          printf '%s' '' | base64 -d > .proof/input.patch
          git apply --index .proof/input.patch
          pnpm exec oxfmt --write --threads=1 --config .oxfmtrc.jsonc src/gateway/openai-compat-errors.ts src/gateway/openai-compatible-agent-run.test.ts src/gateway/openai-compatible-archived-session.server.test.ts docs/gateway/openai-http-api.md docs/gateway/openresponses-http-api.md
          cp src/gateway/openai-compat-errors.ts src/gateway/openai-compatible-agent-run.test.ts src/gateway/openai-compatible-archived-session.server.test.ts .proof/formatted/src/gateway/
          cp docs/gateway/openai-http-api.md docs/gateway/openresponses-http-api.md .proof/formatted/docs/gateway/
          cp config/test-lines-allocations/openai-session-conflict-errors.txt .proof/formatted/config/test-lines-allocations/
          git diff HEAD --binary > .proof/tested.patch
          git rev-parse HEAD > .proof/source-base.txt
          sha256sum src/gateway/openai-compat-errors.ts src/gateway/openai-compatible-agent-run.test.ts src/gateway/openai-compatible-archived-session.server.test.ts docs/gateway/openai-http-api.md docs/gateway/openresponses-http-api.md config/test-lines-allocations/openai-session-conflict-errors.txt > .proof/source-hashes.txt
      - name: Complete affected JSON and SSE endpoint suites
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-vitest.mjs src/gateway/openai-compatible-agent-run.test.ts src/gateway/openai-compatible-archived-session.server.test.ts src/gateway/openresponses-http.test.ts src/gateway/openai-http.test.ts --maxWorkers=1 --reporter=json --outputFile=.proof/contracts.json 2>&1 | tee .proof/contracts.log
      - name: Production and affected Gateway test types
        shell: bash
        run: |
          set -o pipefail
          bash scripts/ci-collect-checks.sh 'pnpm tsgo:core' 'node scripts/run-tsgo.mjs -p test/tsconfig/tsconfig.core.test.gateway-root.json' 2>&1 | tee .proof/types.log
      - name: Changed owner lint format and regression budget
        shell: bash
        run: |
          set -o pipefail
          node --import ./scripts/tsx.mjs scripts/run-oxlint-shards.mts --files-json '["src/gateway/openai-compat-errors.ts","src/gateway/openai-compatible-agent-run.test.ts","src/gateway/openai-compatible-archived-session.server.test.ts"]' 2>&1 | tee .proof/lint.log
          pnpm exec oxfmt --check src/gateway/openai-compat-errors.ts src/gateway/openai-compatible-agent-run.test.ts src/gateway/openai-compatible-archived-session.server.test.ts docs/gateway/openai-http-api.md docs/gateway/openresponses-http-api.md 2>&1 | tee .proof/format.log
          pnpm check:test-lines-ratchet --base ca4cf041fc3b0f2d2bd6d39ecdfbe8899f9e5754 2>&1 | tee .proof/test-lines.log
          git diff --check HEAD
      - name: Documentation content checks
        shell: bash
        run: |
          set -o pipefail
          pnpm check:docs:content 2>&1 | tee .proof/docs.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: session-conflict-candidate-20261104
          path: .proof/
          include-hidden-files: true
