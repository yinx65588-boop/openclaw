name: Google Chat conflict resolution validation
on:
  push:
    branches: [proof/googlechat-conflicts-20261028]
permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=8192
  OPENCLAW_VITEST_RUNTIME: bun
jobs:
  focused:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: adfb544f6f38b7514f99c426e8d919e8dd4c547b
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.22.1'
          install-bun: 'false'
          cache-mode: restore
          semantic-checks: 'true'
      - uses: ./.github/actions/setup-test-bun
      - name: Apply merged candidate and format touched files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .proof
          printf '%s' '' | base64 -d > .proof/candidate.patch
          git apply --check .proof/candidate.patch
          git apply .proof/candidate.patch
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}" > .proof/changed-paths.txt
          pnpm exec oxfmt --write "${changed[@]}"
          git diff --check
          git diff --binary > .proof/tested.patch
          mkdir -p .proof/source
          cp --parents "${changed[@]}" .proof/source/
      - name: Google Chat plugin regression suite
        shell: bash
        run: |
          set -o pipefail
          pnpm test:extension googlechat --maxWorkers=1 2>&1 | tee .proof/googlechat-tests.log
      - name: Shared approval and real reply-dispatch consumers
        if: success() || failure()
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-vitest.mjs src/plugin-sdk/approval-native-helpers.test.ts src/auto-reply/reply/dispatch-from-config.lifecycle.test.ts --maxWorkers=1 2>&1 | tee .proof/consumer-tests.log
      - name: Core and affected test type graphs
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-tsgo.mjs -p tsconfig.core.json --noEmit 2>&1 | tee .proof/core-types.log
          node scripts/run-tsgo.mjs -p test/tsconfig/tsconfig.core.test.messaging.json --noEmit 2>&1 | tee .proof/messaging-types.log
          node scripts/run-tsgo.mjs -p test/tsconfig/tsconfig.core.test.plugin-sdk.json --noEmit 2>&1 | tee .proof/sdk-test-types.log
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          fs.writeFileSync('.proof/tsconfig.googlechat-tests.json', JSON.stringify({
            extends:'../test/tsconfig/tsconfig.extensions.test.json',
            compilerOptions:{tsBuildInfoFile:'../.artifacts/tsgo-cache/googlechat-conflict-tests.tsbuildinfo'},
            include:['../test/types/vitest-codex-attempt-runtime.d.ts','../src/**/*.d.ts','../ui/**/*.d.ts','../extensions/**/*.d.ts','../packages/**/*.d.ts','../extensions/googlechat/src/approval-card-actions.test.ts','../extensions/googlechat/src/approval-handler.runtime.test.ts']
          }));
          JS
          node scripts/run-tsgo.mjs -p .proof/tsconfig.googlechat-tests.json --noEmit 2>&1 | tee .proof/googlechat-types.log
      - name: Changed owner lint and formatting
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-oxlint.mjs --openclaw-focused-config config/tsconfig/oxlint.core.json src/channels/plugins/exec-approval-local.ts src/plugin-sdk/approval-native-helpers.ts src/plugin-sdk/approval-native-helpers.test.ts src/auto-reply/reply/dispatch-from-config.lifecycle.test.ts 2>&1 | tee .proof/core-lint.log
          node scripts/run-oxlint.mjs --tsconfig extensions/tsconfig.json --threads=1 extensions/googlechat/src/approval-card-actions.ts extensions/googlechat/src/approval-card-actions.test.ts extensions/googlechat/src/approval-handler.runtime.test.ts 2>&1 | tee .proof/googlechat-lint.log
          mapfile -t changed < .proof/changed-paths.txt
          pnpm exec oxfmt --check "${changed[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: googlechat-conflicts-20261028
          path: .proof
          include-hidden-files: true