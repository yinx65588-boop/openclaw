name: Custom Responses retention regression
on:
  push:
    branches: [proof/responses-baseline-20261101]
permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=8192
  OPENCLAW_VITEST_RUNTIME: bun
jobs:
  baseline:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 47cb40a3b3f0d74a3e78ec95076a365d5b75d1ee
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.22.1'
          install-bun: 'false'
          cache-mode: restore
          semantic-checks: 'true'
      - uses: ./.github/actions/setup-test-bun
      - name: Apply regressions without production repair
        run: |
          mkdir -p .proof
          printf '%s' '' | base64 -d > .proof/tests.patch
          git apply .proof/tests.patch
      - name: Record unchanged-source reproduction
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-vitest.mjs src/agents/transcript-policy.test.ts src/agents/embedded-agent-runner/run/attempt-prompt-submit.runtime-replay.test.ts --maxWorkers=1 2>&1 | tee .proof/baseline.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: responses-baseline-20261101
          path: .proof
          include-hidden-files: true
