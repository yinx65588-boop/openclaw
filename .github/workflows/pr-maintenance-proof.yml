name: Session conflict HTTP baseline
on:
  push:
    branches: [proof/session-conflict-baseline-20261104]
permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=8192
  OPENCLAW_VITEST_RUNTIME: bun
jobs:
  baseline:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ca4cf041fc3b0f2d2bd6d39ecdfbe8899f9e5754
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.22.1'
          install-bun: 'false'
          cache-mode: restore
          semantic-checks: 'true'
      - uses: ./.github/actions/setup-test-bun
      - name: Apply regression tests only and capture formatted source
        run: |
          mkdir -p .proof/formatted/src/gateway
          printf '%s' '' | base64 -d > .proof/input.patch
          git apply .proof/input.patch
          pnpm exec oxfmt --write --threads=1 --config .oxfmtrc.jsonc src/gateway/openai-compatible-agent-run.test.ts src/gateway/openai-compatible-archived-session.server.test.ts
          cp src/gateway/openai-compatible-agent-run.test.ts src/gateway/openai-compatible-archived-session.server.test.ts .proof/formatted/src/gateway/
          git diff --binary > .proof/tested.patch
          git rev-parse HEAD > .proof/source-base.txt
          sha256sum src/gateway/openai-compat-errors.ts src/gateway/openai-compatible-agent-run.test.ts src/gateway/openai-compatible-archived-session.server.test.ts > .proof/source-hashes.txt
      - name: Establish four boundary failures and two archived-session controls
        shell: bash
        run: |
          set -o pipefail
          set +e
          node scripts/run-vitest.mjs src/gateway/openai-compatible-agent-run.test.ts src/gateway/openai-compatible-archived-session.server.test.ts --maxWorkers=1 -t 'sanitized conflict|reports session conflicts|preserves archived sessions' --reporter=json --outputFile=.proof/baseline.json 2>&1 | tee .proof/baseline.log
          result=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$result" > .proof/baseline-exit.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('.proof/baseline.json').read_text())
          assert report['numFailedTests'] == 4, report
          assert report['numPassedTests'] == 2, report
          assert Path('.proof/baseline-exit.txt').read_text().strip() == '1'
          failed = [t for suite in report['testResults'] for t in suite['assertionResults'] if t['status'] == 'failed']
          assert len(failed) == 4
          assert all('sanitized conflict' in t['fullName'] or 'reports session conflicts' in t['fullName'] for t in failed)
          assert all('expected' in '\n'.join(t['failureMessages']).lower() for t in failed)
          print('Verified: four intended conflict-envelope failures; two archived-session controls pass.')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: session-conflict-baseline-20261104
          path: .proof/
          include-hidden-files: true
