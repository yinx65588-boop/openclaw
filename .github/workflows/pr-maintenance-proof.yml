name: Agents API cron completion final resource lifetime validation
on:
  push:
    branches: [proof/agentsapi-cron-final-static-20261023]
permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=8192
jobs:
  regression:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENCLAW_VITEST_RUNTIME: bun
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4f39309c731d181adbabe9db8043997d9866a299
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.22.1'
          install-bun: 'false'
          cache-mode: restore
      - uses: ./.github/actions/setup-test-bun
      - name: Apply candidate with identical regression
        run: |
          mkdir -p .proof
          printf '%s' '' | base64 -d > .proof/regression.patch
          git apply --check .proof/regression.patch
          git apply .proof/regression.patch
      - name: Types, lint and formatting
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-tsgo.mjs -p tsconfig.core.json 2>&1 | tee .proof/core-types.log
          node scripts/run-tsgo.mjs -p test/tsconfig/tsconfig.core.test.services-cron.json 2>&1 | tee .proof/cron-types.log
          node scripts/run-oxlint.mjs --tsconfig tsconfig.json --threads=1 src/cron/isolated-agent/run.ts src/cron/cron-execution-diagnostics.e2e.test.ts 2>&1 | tee .proof/lint.log
          node scripts/run-format.mts --check src/cron/isolated-agent/run.ts src/cron/cron-execution-diagnostics.e2e.test.ts 2>&1 | tee .proof/format.log
          git diff --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: agentsapi-cron-validation
          path: .proof/
          include-hidden-files: true
