name: Tenki review follow-up regression proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-proof:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: yinx65588-boop/deer-flow
          ref: 758a4310ed8f60e7a051e36a26174a038f9ac275
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: '0.11.1'
      - name: Prepare identical review regressions
        run: |
          printf '%s' '' | base64 --decode > /tmp/review-tests.patch
          printf '%s' '' | base64 --decode > /tmp/review-repair.patch
          git apply /tmp/review-tests.patch
      - working-directory: backend
        run: uv sync --locked --group dev --extra postgres
      - name: Reproduce registered exit-hook failure on reviewed head
        working-directory: backend
        run: |
          set +e
          uv run --locked pytest tests/test_tenki_lifecycle.py -k atexit -q --junitxml=/tmp/review-baseline.xml
          result=$?
          set -e
          echo "Original pytest exit: $result"
          test "$result" -eq 1
          python - <<'PY'
          from xml.etree import ElementTree as ET
          cases = ET.parse('/tmp/review-baseline.xml').findall('.//testcase')
          assert len(cases) == 3
          assert not any(case.find('error') is not None for case in cases)
          failures = [case for case in cases if case.find('failure') is not None]
          assert len(failures) == 1
          assert failures[0].get('name') == 'test_atexit_logs_incomplete_cleanup_without_losing_retry'
          assert 'RuntimeError: Tenki shutdown incomplete' in failures[0].find('failure').text
          PY
      - name: Apply focused repair
        run: |
          git apply --reverse /tmp/review-tests.patch
          git apply /tmp/review-repair.patch
      - name: Tenki and shared lifecycle owners
        working-directory: backend
        run: uv run --locked pytest tests/test_tenki_lifecycle.py tests/test_tenki_provider.py tests/test_warm_pool_lifecycle.py tests/test_acquire_serialization.py -q
      - name: Strict blocking I/O
        working-directory: backend
        run: make test-blocking-io
      - name: Backend lint and formatting
        working-directory: backend
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked pytest tests/test_agent_guidance_check.py -q
          git diff --check