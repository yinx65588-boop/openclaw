name: Sandbox skill catalog retained cleanup and static proof
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=8192
jobs:
  candidate:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: db664c77e82fa3ed02cea1557ab590ab6a27fd5d
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.22.1'
          install-bun: 'false'
          cache-mode: restore
          semantic-checks: 'true'
      - uses: ./.github/actions/setup-test-bun
      - name: Apply frozen candidate and format
        run: |
          mkdir -p .proof
          echo '' | base64 --decode > .proof/input.patch
          git apply .proof/input.patch
          git add -N src/agents/sandbox/skill-catalog.ts
          node scripts/run-format.mts --write src/agents/cli-runner.ts src/agents/embedded-agent-runner/direct-compaction.ts src/agents/embedded-agent-runner/run/attempt.ts src/agents/embedded-agent-runner/run/run-attempt-dispatch.ts src/agents/embedded-agent-runner/sandbox-skills.ts src/agents/sandbox.resolveSandboxContext.test.ts src/agents/sandbox/context.ts src/agents/sandbox/skill-catalog.ts src/skills/loading/workspace-skill-sync.runtime.test.ts src/skills/loading/workspace-skill-sync.runtime.ts
          git diff --check
          git diff --binary > .proof/tested.patch
      - name: Context, publication, prompt and custody regressions
        run: |
          set -o pipefail
          node scripts/test-projects.mts src/agents/sandbox.resolveSandboxContext.test.ts src/agents/embedded-agent-runner/sandbox-skills.test.ts src/skills/loading/workspace-skill-sync.runtime.test.ts src/skills/loading/workspace-skill-sync.custody.test.ts src/agents/agent-tools.prefix-stability.test.ts src/agents/embedded-agent-runner/run/run-attempt-dispatch.owner.test.ts src/agents/cli-runner.reliability.test.ts --maxWorkers=1 --reporter=default 2>&1 | tee .proof/candidate.log
      - name: Touched production and test type graphs
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          node scripts/run-tsgo.mjs -p tsconfig.core.json --noEmit 2>&1 | tee .proof/production-types.log
          node scripts/run-tsgo.mjs -p test/tsconfig/tsconfig.core.test.agents-root.json --noEmit 2>&1 | tee .proof/agents-root-types.log
          node scripts/run-tsgo.mjs -p test/tsconfig/tsconfig.core.test.agents-other.json --noEmit 2>&1 | tee .proof/agents-other-types.log
          node scripts/run-tsgo.mjs -p test/tsconfig/tsconfig.core.test.other.json --noEmit 2>&1 | tee .proof/skills-types.log
      - name: Changed-file lint, format, mock exports and line cap
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          node scripts/run-format.mts --check src/agents/cli-runner.ts src/agents/embedded-agent-runner/direct-compaction.ts src/agents/embedded-agent-runner/run/attempt.ts src/agents/embedded-agent-runner/run/run-attempt-dispatch.ts src/agents/embedded-agent-runner/sandbox-skills.ts src/agents/sandbox.resolveSandboxContext.test.ts src/agents/sandbox/context.ts src/agents/sandbox/skill-catalog.ts src/skills/loading/workspace-skill-sync.runtime.test.ts src/skills/loading/workspace-skill-sync.runtime.ts
          node --import ./scripts/tsx.mjs scripts/run-oxlint.mts --openclaw-focused-config config/tsconfig/oxlint.core.json src/agents/cli-runner.ts src/agents/embedded-agent-runner/direct-compaction.ts src/agents/embedded-agent-runner/run/attempt.ts src/agents/embedded-agent-runner/run/run-attempt-dispatch.ts src/agents/embedded-agent-runner/sandbox-skills.ts src/agents/sandbox.resolveSandboxContext.test.ts src/agents/sandbox/context.ts src/agents/sandbox/skill-catalog.ts src/skills/loading/workspace-skill-sync.runtime.test.ts src/skills/loading/workspace-skill-sync.runtime.ts 2>&1 | tee .proof/lint.log
          node --import ./scripts/tsx.mjs scripts/check-test-mock-exports.mts
          node scripts/check-line-cap-ratchet.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: sandbox-skills-candidate
          path: .proof/
          include-hidden-files: true
