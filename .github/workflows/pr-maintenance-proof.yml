name: Sandbox skills active-catalog baseline reproduction
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=8192
jobs:
  baseline:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: db664c77e82fa3ed02cea1557ab590ab6a27fd5d
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.22.1'
          install-bun: 'false'
          cache-mode: restore
      - uses: ./.github/actions/setup-test-bun
      - name: Apply regression without changing production
        run: |
          mkdir -p .proof
          echo '' | base64 --decode > .proof/regression.patch
          git apply .proof/regression.patch
          node scripts/run-format.mts --write src/agents/sandbox.resolveSandboxContext.test.ts
          git diff --check
          git diff --binary > .proof/tested.patch
      - name: Real sandbox context and materialization owner
        run: |
          set -o pipefail
          node scripts/test-projects.mts src/agents/sandbox.resolveSandboxContext.test.ts --maxWorkers=1 -t "keeps an active sandbox's advertised skill bytes" --reporter=default 2>&1 | tee .proof/baseline.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: sandbox-skills-active-catalog-baseline
          path: .proof/
          include-hidden-files: true
