name: Retained SSH catalogs final lint repair
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=8192
jobs:
  static:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4b85835fc16692ebc86b491913b1f6f989df7a79
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.22.1'
          install-bun: 'false'
          cache-mode: restore
          semantic-checks: 'true'
      - name: Prepare frozen patch
        run: mkdir -p .proof
      - name: Stage patch part 1
        run: |
          printf '%s' '' >> .proof/input.b64
      - name: Stage patch part 2
        run: |
          printf '%s' '' >> .proof/input.b64
      - name: Apply final frozen source
        run: |
          base64 -d .proof/input.b64 > .proof/input.patch
          git apply .proof/input.patch
          git diff --check
          git diff --binary > .proof/tested.patch
      - name: Changed owner lint and format
        run: |
          set -o pipefail
          node scripts/run-oxlint.mjs --openclaw-focused-config config/tsconfig/oxlint.core.json src/agents/sandbox/backend.types.ts src/agents/sandbox/context.ts src/agents/sandbox/remote-shell-backend.ts src/agents/sandbox/remote-shell-backend.test.ts src/skills/loading/workspace-skill-sync.runtime.ts 2>&1 | tee .proof/lint.log
          mapfile -t changed < <(git diff --name-only)
          pnpm exec oxfmt --check "${changed[@]}"
      - name: Agent test type contract after fixture simplification
        if: always()
        run: |
          set -o pipefail
          node scripts/run-tsgo.mjs -p test/tsconfig/tsconfig.core.test.agents-other.json --noEmit 2>&1 | tee .proof/test-types.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: sandbox-remote-static-20261025
          path: .proof
          include-hidden-files: true
