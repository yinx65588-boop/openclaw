name: Retained remote skill catalog regression
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=8192
jobs:
  regression:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4b85835fc16692ebc86b491913b1f6f989df7a79
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.22.1'
          install-bun: 'false'
          cache-mode: restore
          semantic-checks: 'true'
      - uses: ./.github/actions/setup-test-bun
      - name: Apply regression fixture
        run: |
          mkdir -p .proof
          echo '' | base64 -d > .proof/regression.patch
          git apply .proof/regression.patch
          git diff --check
      - name: Reused remote workspace and active reader regression
        run: |
          set +e
          node scripts/test-projects.mts src/agents/sandbox/remote-shell-backend.test.ts --maxWorkers=1 --reporter=json --outputFile=.proof/remote.json 2>&1 | tee .proof/remote.log
          result=${PIPESTATUS[0]}
          printf '%s\n' "$result" > .proof/original-exit.txt
          exit "$result"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: sandbox-remote-regression-20261024
          path: .proof
          include-hidden-files: true
