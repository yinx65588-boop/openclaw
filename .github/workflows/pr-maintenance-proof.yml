name: Sandbox skill catalog candidate proof
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=8192
jobs:
  candidate:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: db664c77e82fa3ed02cea1557ab590ab6a27fd5d
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.22.1'
          install-bun: 'false'
          cache-mode: restore
      - uses: ./.github/actions/setup-test-bun
      - name: Apply frozen candidate and format
        run: |
          mkdir -p .proof
          echo '' | base64 --decode > .proof/input.patch
          git apply .proof/input.patch
          git add -N src/agents/sandbox/skill-catalog.ts
          node scripts/run-format.mts --write src/agents/cli-runner.ts src/agents/embedded-agent-runner/direct-compaction.ts src/agents/embedded-agent-runner/run/attempt.ts src/agents/embedded-agent-runner/run/run-attempt-dispatch.ts src/agents/embedded-agent-runner/sandbox-skills.ts src/agents/sandbox.resolveSandboxContext.test.ts src/agents/sandbox/context.ts src/agents/sandbox/skill-catalog.ts src/skills/loading/workspace-skill-sync.runtime.test.ts src/skills/loading/workspace-skill-sync.runtime.ts
          git diff --check
          git diff --binary > .proof/tested.patch
      - name: Context, publication, prompt and custody regressions
        run: |
          set -o pipefail
          node scripts/test-projects.mts src/agents/sandbox.resolveSandboxContext.test.ts src/agents/embedded-agent-runner/sandbox-skills.test.ts src/skills/loading/workspace-skill-sync.runtime.test.ts src/skills/loading/workspace-skill-sync.custody.test.ts --maxWorkers=1 --reporter=default 2>&1 | tee .proof/candidate.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: sandbox-skills-candidate
          path: .proof/
          include-hidden-files: true
