name: Session token field documentation proof
on:
  push:
    branches: [proof/session-token-docs-20261104]
permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=8192
  OPENCLAW_VITEST_RUNTIME: bun
jobs:
  docs-and-contracts:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 64b00dd6dd9d9a156f2c11049822c3884bd3b25d
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.22.1'
          install-bun: 'false'
          cache-mode: restore
          semantic-checks: 'true'
      - uses: ./.github/actions/setup-test-bun
      - name: Apply only the two documentation edits
        run: |
          mkdir -p .proof
          printf '%s' '' | base64 -d > .proof/input.patch
          git apply --index .proof/input.patch
          git rev-parse HEAD > .proof/source-base.txt
      - name: Canonical formatting and final input capture
        shell: bash
        run: |
          set -o pipefail
          pnpm exec oxfmt --write --threads=1 --config .oxfmtrc.jsonc docs/cli/sessions.md docs/reference/session-management-compaction/schema.md 2>&1 | tee .proof/format.log
          git diff HEAD --binary > .proof/tested.patch
          mkdir -p .proof/formatted/docs/cli .proof/formatted/docs/reference/session-management-compaction
          cp docs/cli/sessions.md .proof/formatted/docs/cli/
          cp docs/reference/session-management-compaction/schema.md .proof/formatted/docs/reference/session-management-compaction/
          sha256sum docs/cli/sessions.md docs/reference/session-management-compaction/schema.md > .proof/source-hashes.txt
      - name: Documentation validation
        shell: bash
        run: |
          set -o pipefail
          bash scripts/ci-collect-checks.sh 'pnpm format:docs:check' 'pnpm check:docs:content' 'pnpm docs:check-links:anchors' 2>&1 | tee .proof/docs.log
      - name: Existing accounting, context validity and sessions JSON contracts
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-vitest.mjs src/commands/sessions.test.ts src/auto-reply/reply/session-usage.test.ts src/config/sessions/context-token-provenance.test.ts --maxWorkers=1 2>&1 | tee .proof/contracts.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: session-token-docs-20261104
          path: .proof/
          include-hidden-files: true
