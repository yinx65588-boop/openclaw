name: Codex compaction fresh-base focused validation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=8192
  SOURCE_BASE: e96c7041019b0623b234f8c2022ab9476e24f708
jobs:
  focused:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e96c7041019b0623b234f8c2022ab9476e24f708
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.22.1'
          install-bun: 'false'
          cache-mode: restore
          semantic-checks: 'true'
      - uses: ./.github/actions/setup-test-bun
      - name: Apply candidate and normalize changed-file formatting
        run: |
          mkdir -p .proof
          printf '%s' '' | base64 -d > .proof/candidate.patch
          git apply .proof/candidate.patch
          git diff --name-only > .proof/changed-files.txt
          xargs node scripts/run-format.mts --check < .proof/changed-files.txt
          git diff --binary > .proof/formatted-candidate.patch
          git diff --check
      - name: Real pinned native compaction and durable marker
        shell: bash
        run: |
          set -o pipefail
          /usr/bin/time -p node scripts/run-vitest.mjs run --config test/vitest/vitest.extension-database-workers.config.ts extensions/codex/src/app-server/compact.native.test.ts --maxWorkers=1 --reporter=default --reporter=json --outputFile=.proof/native.json 2>&1 | tee .proof/native.log
      - name: Manual compaction lifecycle siblings
        if: always()
        shell: bash
        run: |
          set -o pipefail
          /usr/bin/time -p node scripts/run-vitest.mjs run --config test/vitest/vitest.extension-database-workers.config.ts extensions/codex/src/app-server/compact.test.ts extensions/codex/src/app-server/compact.cancellation.test.ts --maxWorkers=1 --reporter=default --reporter=json --outputFile=.proof/manual.json 2>&1 | tee .proof/manual.log
      - name: Automatic compaction and marker publication siblings
        if: always()
        shell: bash
        run: |
          set -o pipefail
          /usr/bin/time -p node scripts/run-vitest.mjs run --config test/vitest/vitest.extension-codex-app-server-support.config.ts extensions/codex/src/app-server/event-projector.verbose-hooks.test.ts extensions/codex/src/app-server/event-projector.terminal-errors.test.ts extensions/codex/src/app-server/context-compaction-activity.test.ts --maxWorkers=1 --reporter=default --reporter=json --outputFile=.proof/automatic.json 2>&1 | tee .proof/automatic.log
      - name: Transcript context reader regressions
        if: always()
        shell: bash
        run: |
          set -o pipefail
          /usr/bin/time -p node scripts/run-vitest.mjs run --config test/vitest/vitest.gateway-core.config.ts src/gateway/session-transcript-derived-readers.usage.test.ts --maxWorkers=1 --reporter=default --reporter=json --outputFile=.proof/readers.json 2>&1 | tee .proof/readers.log
      - name: Public status unknown-context controls
        if: always()
        run: |
          set -o pipefail
          node scripts/test-projects.mts src/auto-reply/reply/commands-status.test.ts --maxWorkers=1 --reporter=default --reporter=json --outputFile=.proof/status.json 2>&1 | tee .proof/status.log
      - name: Require executed tests for every selected boundary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ['native','manual','automatic','readers','status']:
              result=json.loads(Path('.proof/'+name+'.json').read_text())
              assert result['numTotalTests']>0, (name,'no executed tests')
              assert result['numFailedTests']==0 and result['success'], (name,result['numFailedTests'])
              print(name,result['numPassedTests'],'passed',result.get('numPendingTests',0),'pending')
          PY
      - name: Core production types
        if: always()
        run: node scripts/run-tsgo.mjs -p tsconfig.core.json --noEmit
      - name: Extension production types
        if: always()
        run: node scripts/run-tsgo.mjs -p tsconfig.extensions.json --noEmit
      - name: Changed test contracts and consumers types
        if: always()
        run: |
          printf '%s' '' | base64 --decode > .proof/tsconfig.candidate-tests.json
          node scripts/run-tsgo.mjs -p .proof/tsconfig.candidate-tests.json --noEmit
      - name: Changed file owner lint
        if: always()
        run: |
          set -euo pipefail
          node scripts/run-oxlint.mjs --deny-warnings --tsconfig tsconfig.core.json src/gateway/session-transcript-derived-readers.ts
          mapfile -t plugin_files < <(git diff --name-only -- extensions/codex | sed '/\.test\.ts$/d')
          node scripts/run-oxlint.mjs --deny-warnings --tsconfig tsconfig.extensions.json "${plugin_files[@]}"
          mapfile -t test_files < <(git diff --name-only | sed -n '/\.test\.ts$/p')
          node scripts/run-oxlint.mjs --deny-warnings --tsconfig .proof/tsconfig.candidate-tests.json "${test_files[@]}"
      - name: Mock and line cap guards
        if: always()
        run: |
          set -euo pipefail
          pnpm check:test-mock-exports
          node scripts/check-line-cap-ratchet.mjs --base "$SOURCE_BASE" --no-merge-base
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: codex-compaction-focused-20261024
          path: .proof/
          include-hidden-files: true