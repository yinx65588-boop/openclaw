name: Sandbox skill catalog exact PR head shipped proof
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=8192
jobs:
  shipped:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VARIANT: repaired
      SOURCE_SHA: 4b85835fc16692ebc86b491913b1f6f989df7a79
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4b85835fc16692ebc86b491913b1f6f989df7a79
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.22.1'
          install-bun: 'false'
          cache-mode: restore
      - name: Capture exact PR source and controlled model fixture
        run: |
          set -euo pipefail
          mkdir -p .proof
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git rev-parse HEAD > .proof/source-head.txt
          echo '' | base64 --decode > .proof/cli.py
          cat > .proof/netproof.sh <<'SH'
          set -euo pipefail
          mount --make-rprivate /
          ip link set lo up
          test -z "$(ip -4 route show default)"
          test -z "$(ip -6 route show default)"
          python3 .proof/cli.py
          SH
      - name: Build actual CLI and load isolated Docker image
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee .proof/build.log
          docker pull alpine:3.22
          docker image inspect alpine:3.22 > .proof/docker-image.json
      - name: Real Gateway, concurrent agents and Docker tool reads
        run: |
          set -o pipefail
          sudo env -i "PATH=$PATH" "COREPACK_HOME=$COREPACK_HOME" "NODE_OPTIONS=$NODE_OPTIONS" "PROOF_ROOT=$PWD/.proof/cli" "PROOF_DOCKER_IMAGE=alpine:3.22" "VARIANT=$VARIANT" "SOURCE_SHA=$SOURCE_SHA" unshare --mount --net --fork bash .proof/netproof.sh 2>&1 | tee .proof/cli.log
      - name: Make controlled evidence readable
        if: always()
        run: |
          mkdir -p .proof/published
          for file in .proof/cli/*.log .proof/cli/result.json; do
            if sudo test -f "$file"; then sudo install -m 0644 "$file" ".proof/published/$(basename "$file")"; fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: sandbox-skills-exact-head
          path: |
            .proof/published/
            .proof/build.log
            .proof/cli.log
            .proof/cli.py
            .proof/source-head.txt
            .proof/docker-image.json
          include-hidden-files: true
