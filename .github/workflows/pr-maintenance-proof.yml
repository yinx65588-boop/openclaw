name: Agents API cron shipped CLI TLS proof
on:
  push:
    branches: [proof/agentsapi-cron-cli-20261023]
permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=8192
jobs:
  cli:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, repaired]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4f39309c731d181adbabe9db8043997d9866a299
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.22.1'
          install-bun: 'false'
          cache-mode: restore
      - uses: ./.github/actions/setup-test-bun
      - name: Prepare fixed source and secretless HTTP fixture
        run: |
          mkdir -p .proof/cli
          printf '%s' '' | base64 -d > .proof/candidate.patch
          printf '%s' '' | base64 -d > .proof/cli.py
          if [ '${{ matrix.variant }}' = repaired ]; then git apply .proof/candidate.patch; fi
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout .proof/cli/server.key -out .proof/cli/server.crt -subj '/CN=api.openai.com' -addext 'subjectAltName=DNS:api.openai.com' -addext 'basicConstraints=critical,CA:TRUE'
          awk '!/api.openai.com/' /etc/hosts > .proof/cli/hosts
          printf '\n93.184.216.34 api.openai.com\n' >> .proof/cli/hosts
          cat > .proof/netproof.sh <<'SH'
          set -euo pipefail
          mount --make-rprivate /
          ip link set lo up
          ip addr add 93.184.216.34/32 dev lo
          mount --bind "$PROOF_ROOT/hosts" /etc/hosts
          python3 .proof/cli.py
          SH
      - name: Build shipped CLI
        run: pnpm build 2>&1 | tee .proof/build.log
      - name: Exercise shipped cron commands in a private network namespace
        shell: bash
        run: |
          set -euo pipefail
          sudo env "PATH=$PATH" "PROOF_ROOT=$PWD/.proof/cli" "NODE_EXTRA_CA_CERTS=$PWD/.proof/cli/server.crt" "VARIANT=${{ matrix.variant }}" "HOME=$PWD/.proof/cli/home" unshare --mount --net --fork bash .proof/netproof.sh 2>&1 | tee .proof/cli-result.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: agentsapi-cron-cli-${{ matrix.variant }}
          path: |
            .proof/build.log
            .proof/cli-result.log
            .proof/cli/*.log
            .proof/cli/*.json
            .proof/cli.py
            .proof/candidate.patch
          include-hidden-files: true