name: Custom Responses shipped boundary proof
on:
  push:
    branches: [proof/responses-candidate-20261101]
permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=8192
  OPENCLAW_VITEST_RUNTIME: bun
jobs:
  shipped:
    if: github.repository == 'yinx65588-boop/openclaw'
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, repaired]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 47cb40a3b3f0d74a3e78ec95076a365d5b75d1ee
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.22.1'
          install-bun: 'false'
          cache-mode: restore
          semantic-checks: 'true'
      - uses: ./.github/actions/setup-test-bun
      - name: Prepare pinned candidate and public CLI fixture
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          mkdir -p .proof
          printf '%s' '' | base64 -d > .proof/candidate.patch
          printf '%s' '' | base64 -d > .proof/cli.mjs
          if [ "$VARIANT" = repaired ]; then git apply --index .proof/candidate.patch; fi
          git diff HEAD --binary > .proof/tested.patch
          git rev-parse HEAD > .proof/source-base.txt
      - name: Focused owner, persistence and request-prefix regressions
        if: matrix.variant == 'repaired'
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-vitest.mjs src/agents/transcript-policy.test.ts src/agents/embedded-agent-runner/run/attempt-prompt-submit.runtime-replay.test.ts src/agents/embedded-agent-runner/run/attempt.llm-boundary.cache-stability.test.ts --maxWorkers=1 2>&1 | tee .proof/tests.log
      - name: Production and affected test types
        if: matrix.variant == 'repaired'
        shell: bash
        run: |
          set -o pipefail
          bash scripts/ci-collect-checks.sh 'pnpm tsgo:core' 'node scripts/run-tsgo.mjs -p test/tsconfig/tsconfig.core.test.agents-root.json' 'node scripts/run-tsgo.mjs -p test/tsconfig/tsconfig.core.test.infra.json' 2>&1 | tee .proof/types.log
      - name: Changed-owner lint and formatting
        if: matrix.variant == 'repaired'
        shell: bash
        run: |
          set -o pipefail
          node --import ./scripts/tsx.mjs scripts/run-oxlint-shards.mts --files-json '["src/agents/transcript-policy.ts","src/agents/transcript-policy.test.ts","src/agents/embedded-agent-runner/run/attempt-prompt-submit.runtime-replay.test.ts"]' 2>&1 | tee .proof/lint.log
          pnpm exec oxfmt --check src/agents/transcript-policy.ts src/agents/transcript-policy.test.ts src/agents/embedded-agent-runner/run/attempt-prompt-submit.runtime-replay.test.ts 2>&1 | tee .proof/format.log
          pnpm check:test-lines-ratchet --base 47cb40a3b3f0d74a3e78ec95076a365d5b75d1ee 2>&1 | tee .proof/test-lines.log
      - name: Build shipped CLI
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee .proof/build.log
      - name: Real HTTP provider, two tool loops and a cold CLI process reopen
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          mkdir -p .proof/cli/home
          printf '%s
' '#!/usr/bin/env bash' 'set -euo pipefail' 'ip link set lo up' 'node .proof/cli.mjs' > .proof/netproof.sh
          set +e
          sudo env -i "PATH=$PATH" "COREPACK_HOME=$COREPACK_HOME" "NODE_OPTIONS=$NODE_OPTIONS" "HOME=$PWD/.proof/cli/home" "VARIANT=$VARIANT" unshare --mount --net --fork bash .proof/netproof.sh 2>&1 | tee .proof/cli-result.log
          proof_exit=${PIPESTATUS[0]}
          set -e
          printf '%s
' "$proof_exit" > .proof/original-exit.txt
          sudo env -i "PATH=$PATH" "VARIANT=$VARIANT" "PROOF_EXIT=$proof_exit" python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path('.proof/cli/result.json').read_text())
          assert result['variant'] == os.environ['VARIANT']
          assert not result['fixtureFailures']
          assert result['requests'] == 4, result
          assert result['firstCarrierCount'] > 0, result
          assert result['instructionsMatch'] and result['toolsMatch'], result
          if os.environ['VARIANT'] == 'baseline':
              assert os.environ['PROOF_EXIT'] == '1' and not result['passed'], result
              assert not result['firstCarrierRetained'] and not result['reopenedPrefixMatches'], result
              assert 'historical runtime carrier must be retained' in result['failure'], result
          else:
              assert os.environ['PROOF_EXIT'] == '0' and result['passed'], result
              assert result['firstCarrierRetained'] and result['reopenedPrefixMatches'], result
          print(json.dumps(result, indent=2))
          PY
      - name: Preserve readable public evidence
        if: always()
        run: |
          mkdir -p .proof/published
          for file in .proof/cli/*.log .proof/cli/result.json .proof/cli/request-ledger.json; do
            if sudo test -f "$file"; then sudo install -m 0644 "$file" ".proof/published/$(basename "$file")"; fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: responses-shipped-${{ matrix.variant }}-20261101
          path: |
            .proof/published/
            .proof/*.log
            .proof/*.patch
            .proof/*.txt
            .proof/cli.mjs
          include-hidden-files: true
