name: Completion capability invalidation baseline
on:
  push:
    branches: [proof/completion-capability-baseline-20261025]
permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=8192
  OPENCLAW_VITEST_RUNTIME: bun
jobs:
  regression:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 03fa1526e0217c1384543e5168be1d350da56635
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.22.1'
          install-bun: 'false'
          cache-mode: restore
      - uses: ./.github/actions/setup-test-bun
      - name: Stage identical new regression without production repair
        run: |
          mkdir -p .proof
          printf '%s' '' | base64 -d > .proof/regression.patch
          git apply --check .proof/regression.patch
          git apply .proof/regression.patch
          git diff --check
      - name: Exercise completion policy and actual reply injection
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-vitest.mjs src/agents/subagents/spawn/subagent-capabilities.store.test.ts src/auto-reply/reply/reply-tool-authority.worker.test.ts --maxWorkers=1 -t 'retains completion policy|rechecks reply capability authority' 2>&1 | tee .proof/regression.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: completion-capability-baseline-20261025
          path: .proof
          include-hidden-files: true