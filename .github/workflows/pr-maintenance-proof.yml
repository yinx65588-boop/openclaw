name: PR176119 current CI failure comparison
on:
  push:
    branches: [proof/zsh-failures-comparison-20261023]
permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=8192
jobs:
  comparison:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: gateway-base
            source: b8fda397d5c9cf31d820666726e1e6899919a78e
            workers: '8'
            groups: 
          - label: gateway-merge
            source: eb7382ee019cd2866265d6371342d2e4a1cd2153
            workers: '8'
            groups: 
          - label: feishu-base
            source: b8fda397d5c9cf31d820666726e1e6899919a78e
            workers: '2'
            groups: 
          - label: feishu-merge
            source: eb7382ee019cd2866265d6371342d2e4a1cd2153
            workers: '2'
            groups: 
    env:
      OPENCLAW_CI_TEST_RUNTIME_POLICY: bun-all
      OPENCLAW_VITEST_MAX_WORKERS: ${{ matrix.workers }}
      OPENCLAW_NODE_TEST_PLAN_CONCURRENCY: '1'
      OPENCLAW_NODE_TEST_GROUPS_GZIP_BASE64: ${{ matrix.groups }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.22.1'
          install-bun: 'false'
          cache-mode: restore
      - uses: ./.github/actions/setup-test-bun
      - name: Capture original ordered failing CI group and original exit code
        shell: bash
        env:
          EXPECTED_SOURCE: ${{ matrix.source }}
        run: |
          set -euo pipefail
          mkdir -p .proof
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          git rev-parse HEAD > .proof/source.txt
          set +e
          node --import ./scripts/tsx.mjs scripts/ci-run-node-test-shard.mts 2>&1 | tee .proof/original-group.log
          result=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$result" > .proof/original-exit.txt
          echo "Original test group exit: $result"
          test -s .proof/original-group.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: zsh-failure-comparison-${{ matrix.label }}-20261023
          path: .proof/
          include-hidden-files: true
