name: PR176119 browser fixture repair validation
on:
  push:
    branches: [proof/zsh-browser-repair-20261022]
permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=6144
  REVIEWED_HEAD: a4ece30a7723373200a31e33b2171248302a7eff
jobs:
  browser:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENCLAW_CI_TEST_RUNTIME_POLICY: bun-all
      OPENCLAW_VITEST_MAX_WORKERS: '2'
      OPENCLAW_NODE_TEST_PLAN_CONCURRENCY: '1'
      OPENCLAW_NODE_TEST_GROUPS_GZIP_BASE64: 
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.22.1'
          install-bun: 'false'
          cache-mode: restore
      - uses: ./.github/actions/setup-test-bun
      - name: Verify reviewed source and replay the complete original browser group
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .proof
          git fetch --no-tags --depth=1 origin "$REVIEWED_HEAD"
          git diff --exit-code "$REVIEWED_HEAD" HEAD -- . ':!.github/workflows/pr-maintenance-proof.yml'
          node --import ./scripts/tsx.mjs scripts/ci-run-node-test-shard.mts 2>&1 | tee .proof/browser-tests.log
      - name: Check changed fixture lint and formatting
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-oxlint.mjs --tsconfig tsconfig.json --threads=1 extensions/browser/src/browser/chrome.default-browser.test.ts 2>&1 | tee .proof/lint.log
          node scripts/run-format.mts --check extensions/browser/src/browser/chrome.default-browser.test.ts 2>&1 | tee .proof/format.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: zsh-browser-repair-20261022
          path: .proof/
          include-hidden-files: true
