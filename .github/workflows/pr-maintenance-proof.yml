name: Tenki review follow-up complete backend tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  units:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: deerflow
          POSTGRES_PASSWORD: deerflow
          POSTGRES_DB: deerflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_URI: postgresql://deerflow:deerflow@localhost:5432/deerflow_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: yinx65588-boop/deer-flow
          ref: 758a4310ed8f60e7a051e36a26174a038f9ac275
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: '0.11.1'
      - name: Apply reviewed follow-up
        run: |
          mkdir -p .proof
          echo '' | base64 --decode > .proof/repaired.patch
          git apply .proof/repaired.patch
          git diff --check
      - working-directory: backend
        run: uv sync --locked --group dev --extra postgres
      - name: Complete backend shard
        working-directory: backend
        run: |
          set -o pipefail
          make test-shard SPLITS=4 GROUP=${{ matrix.shard }} 2>&1 | tee ../.proof/unit.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: tenki-review-backend-${{ matrix.shard }}
          path: .proof/
          include-hidden-files: true
