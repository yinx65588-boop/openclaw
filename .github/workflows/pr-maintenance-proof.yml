name: Codex compaction context baseline reproduction
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=8192
jobs:
  reproduce:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2c2c2f30e4e475ed71dd02b25bbaa5e811305244
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.22.1'
          install-bun: 'false'
          cache-mode: restore
      - uses: ./.github/actions/setup-test-bun
      - name: Add regressions to unchanged production baseline
        run: |
          mkdir -p .proof
          printf '%s' '' | base64 -d > .proof/reproduction.patch
          git apply .proof/reproduction.patch
          git diff --check
      - name: Real pinned Codex compaction and durable marker
        shell: bash
        run: |
          set -o pipefail
          /usr/bin/time -p node scripts/run-vitest.mjs run --config test/vitest/vitest.extension-database-workers.config.ts extensions/codex/src/app-server/compact.native.test.ts --maxWorkers=1 --reporter=default --reporter=json --outputFile=.proof/native.json 2>&1 | tee .proof/native.log
      - name: Context usage reader baseline
        if: always()
        shell: bash
        run: |
          set -o pipefail
          /usr/bin/time -p node scripts/run-vitest.mjs run --config test/vitest/vitest.gateway-core.config.ts src/gateway/session-transcript-derived-readers.usage.test.ts --maxWorkers=1 --reporter=default --reporter=json --outputFile=.proof/readers.json 2>&1 | tee .proof/readers.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: codex-compaction-usage-baseline
          path: .proof/
          include-hidden-files: true