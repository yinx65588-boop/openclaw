name: Completion capability owner regression and checks
on:
  push:
    branches: [proof/completion-capability-repair-20261025]
permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=8192
  OPENCLAW_VITEST_RUNTIME: bun
jobs:
  regression:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 03fa1526e0217c1384543e5168be1d350da56635
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.22.1'
          install-bun: 'false'
          cache-mode: restore
          semantic-checks: 'true'
      - uses: ./.github/actions/setup-test-bun
      - name: Stage identical regression fixtures
        run: |
          mkdir -p .proof
          printf '%s' '' | base64 -d > .proof/tests.patch
          printf '%s' '' | base64 -d > .proof/source.patch
          git apply .proof/tests.patch
      - name: Record baseline completion and missing-file failures
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-vitest.mjs src/agents/subagents/spawn/subagent-capabilities.store.test.ts --maxWorkers=1 -t 'retains completion policy|retains missing-store capability' 2>&1 | tee .proof/baseline.log
      - name: Apply focused owner repair and format touched files
        shell: bash
        run: |
          set -euo pipefail
          git apply .proof/source.patch
          mapfile -t changed < <(git diff --name-only)
          pnpm exec oxfmt --write "${changed[@]}"
          git diff --check
          git diff --binary > .proof/tested.patch
          mkdir -p .proof/source
          cp --parents "${changed[@]}" .proof/source/
      - name: Verify actual caller and completion consumers
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-vitest.mjs src/agents/subagents/spawn/subagent-capabilities.store.test.ts src/auto-reply/reply/reply-tool-authority.worker.test.ts src/gateway/mcp-http.completion-lineage.test.ts src/gateway/mcp-http.configured-mcp-authority.test.ts src/agents/openclaw-tools.client-caps.test.ts --maxWorkers=1 2>&1 | tee .proof/repaired-tests.log
      - name: Core and affected test type graphs
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-tsgo.mjs -p tsconfig.core.json --noEmit 2>&1 | tee .proof/core-types.log
          node scripts/run-tsgo.mjs -p test/tsconfig/tsconfig.core.test.agents-sessions.json --noEmit 2>&1 | tee .proof/subagent-test-types.log
          node scripts/run-tsgo.mjs -p test/tsconfig/tsconfig.core.test.messaging.json --noEmit 2>&1 | tee .proof/reply-test-types.log
      - name: Changed owner lint and formatting
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-oxlint.mjs --openclaw-focused-config config/tsconfig/oxlint.core.json src/agents/subagents/spawn/subagent-session-store.ts src/agents/subagents/spawn/subagent-capabilities.store.test.ts src/auto-reply/reply/reply-tool-authority.worker.test.ts 2>&1 | tee .proof/lint.log
          mapfile -t changed < <(git diff --name-only)
          pnpm exec oxfmt --check "${changed[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: completion-capability-repair-20261025
          path: .proof
          include-hidden-files: true