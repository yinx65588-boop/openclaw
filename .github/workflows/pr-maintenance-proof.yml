name: Codex native compaction shipped CLI proof
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=8192
  SOURCE_BASE: e96c7041019b0623b234f8c2022ab9476e24f708
jobs:
  shipped:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, repaired]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e96c7041019b0623b234f8c2022ab9476e24f708
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.22.1'
          install-bun: 'false'
          cache-mode: restore
      - name: Stage frozen proof and reviewed candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .proof/cli
          printf '%s' '' | base64 --decode > .proof/cli.py
          printf '%s' '' | base64 --decode > .proof/candidate.patch
          printf '%s  %s\n' '22255676ba6aa4747a1953dec5fc43c89752eda0a48911e02db10322fdf0eceb' '.proof/cli.py' '001bdc415615e0615a8876119f069454c8039093d0b379938d34ac4e9dabb422' '.proof/candidate.patch' | sha256sum --check
          python3 -m py_compile .proof/cli.py
          git rev-parse HEAD > .proof/source-base.txt
          if [ '${{ matrix.variant }}' = repaired ]; then git apply .proof/candidate.patch; fi
          git diff --check
          git diff --binary > .proof/tested.patch
          cat > .proof/netproof.sh <<'SH'
          set -euo pipefail
          mount --make-rprivate /
          ip link set lo up
          test -z "$(ip -4 route show default)"
          test -z "$(ip -6 route show default)"
          python3 .proof/cli.py
          SH
      - name: Build shipped CLI artifacts
        shell: bash
        run: |
          set -euo pipefail
          pnpm build 2>&1 | tee .proof/build.log
      - name: Resolve the actual pinned Codex native executable
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import fs from 'node:fs';
          import { createRequire } from 'node:module';
          import path from 'node:path';
          const pluginRequire = createRequire(path.resolve('extensions/codex/package.json'));
          const manifest = pluginRequire.resolve('@openai/codex/package.json');
          const metadata = JSON.parse(fs.readFileSync(manifest, 'utf8'));
          assert.equal(metadata.version, '0.162.1');
          const nativeRequire = createRequire(manifest);
          let nativeManifest;
          try { nativeManifest = nativeRequire.resolve('@openai/codex-linux-x64/package.json'); }
          catch { nativeManifest = manifest; }
          const binary = fs.realpathSync(path.join(path.dirname(nativeManifest), 'vendor/x86_64-unknown-linux-musl/bin/codex'));
          const version = execFileSync(binary, ['--version'], {encoding:'utf8'}).trim();
          assert.equal(version, 'codex-cli 0.162.1');
          fs.writeFileSync('.proof/codex-binary.txt', binary + '\n');
          fs.writeFileSync('.proof/native-identity.json', JSON.stringify({packageVersion:metadata.version, version, binary, sha256:createHash('sha256').update(fs.readFileSync(binary)).digest('hex')}, null, 2));
          JS
      - name: Exercise shipped commands inside a loopback-only network namespace
        shell: bash
        run: |
          set -euo pipefail
          test -n "${COREPACK_HOME:-}"
          test -d "$COREPACK_HOME"
          codex_binary="$(cat .proof/codex-binary.txt)"
          set +e
          sudo env -i "PATH=$PATH" "COREPACK_HOME=$COREPACK_HOME" "NODE_OPTIONS=$NODE_OPTIONS" "PROOF_ROOT=$PWD/.proof/cli" "CODEX_BINARY=$codex_binary" "PROOF_NETWORK_ISOLATED=1" "SOURCE_BASE=$SOURCE_BASE" "VARIANT=${{ matrix.variant }}" "HOME=$PWD/.proof/cli/home" unshare --mount --net --fork bash .proof/netproof.sh 2>&1 | tee .proof/cli-result.log
          proof_exit=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$proof_exit" > .proof/original-exit.txt
          sudo env -i "PATH=$PATH" "VARIANT=${{ matrix.variant }}" "PROOF_EXIT=$proof_exit" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads(Path('.proof/cli/result.json').read_text())
          assert result['variant'] == os.environ['VARIANT']
          assert result['nativeVersion'] == 'codex-cli 0.162.1'
          assert result['compact']['ok'] is True and result['compact']['compacted'] is True
          assert len(result['requests']) == 2 and result['requests'][1]['compactionTrigger'] is True
          assert result['requests'][0]['threadId'] == result['requests'][1]['threadId']
          assert not result['fixtureFailures']
          assert len(result['rawAfterRestart']) == 1
          assert result['rawBeforeRestart'] == result['rawAfterRestart']
          if os.environ['VARIANT'] == 'baseline':
              assert os.environ['PROOF_EXIT'] == '1'
              assert result['passed'] is False
              assert 'Native compaction marker lacks its known usage boundary' in result['failure']
              assert result['rawAfterRestart'][0]['message'].get('usage') is None
              print('Baseline: real native compaction completed, but its durable usage boundary is absent.')
          else:
              assert os.environ['PROOF_EXIT'] == '0' and result['passed'] is True
              assert 'failure' not in result
              print('Repaired: shipped native compaction persisted the known usage boundary across restart.')
          PY
      - name: Publish readable controlled evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .proof/published
          for proof_file in .proof/cli/*.log .proof/cli/result.json .proof/cli/request-ledger.json .proof/cli/raw-marker-*.json; do
            if sudo test -f "$proof_file"; then
              sudo install -m 0644 "$proof_file" ".proof/published/$(basename "$proof_file")"
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: codex-compaction-shipped-${{ matrix.variant }}
          path: |
            .proof/published/
            .proof/build.log
            .proof/cli-result.log
            .proof/original-exit.txt
            .proof/source-base.txt
            .proof/native-identity.json
            .proof/cli.py
            .proof/candidate.patch
            .proof/tested.patch
          include-hidden-files: true
