name: PR 176119 native and cancellation maintenance validation
on:
  push:
    branches: [proof/zsh-ci-owner-repair-176119]
permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=6144
  REVIEWED_HEAD: ebb1b176890c7df1ba6e0949ec1146f80d8b43f8
jobs:
  native:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: macos-15
    timeout-minutes: 20
    env:
      OPENCLAW_VITEST_RUNTIME: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.21.0'
          install-bun: 'false'
          cache-mode: restore
      - name: Verify source and execute native shell regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .proof
          git fetch --no-tags --depth=1 origin "$REVIEWED_HEAD"
          git diff --exit-code "$REVIEWED_HEAD" HEAD -- . ':!.github/workflows/pr-maintenance-proof.yml'
          sw_vers > .proof/native-platform.log
          /bin/zsh --version >> .proof/native-platform.log
          node scripts/run-vitest.mjs src/agents/shell-utils.test.ts src/agents/shell-snapshot.test.ts src/agents/bash-tools.exec-host-spawn.test.ts src/agents/bash-tools.exec-runtime.test.ts --maxWorkers=1 2>&1 | tee .proof/native-tests.log
          node scripts/run-format.mts --check src/agents/shell-utils.ts src/agents/shell-utils.test.ts src/agents/bash-tools.exec-host-spawn.test.ts package.json docs/tools/exec.md 2>&1 | tee .proof/format.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: zsh-maintenance-native
          path: .proof/
          include-hidden-files: true
  failed_groups:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: memory
            encoded: 
          - group: provider
            encoded: 
    env:
      OPENCLAW_CI_TEST_RUNTIME_POLICY: bun-all
      OPENCLAW_VITEST_MAX_WORKERS: '2'
      OPENCLAW_NODE_TEST_PLAN_CONCURRENCY: '1'
      OPENCLAW_NODE_TEST_GROUPS_GZIP_BASE64: ${{ matrix.encoded }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.21.0'
          install-bun: 'false'
          cache-mode: restore
      - uses: ./.github/actions/setup-test-bun
      - name: Validate the exact previously failing group in original order
        run: |
          mkdir -p .proof
          git rev-parse HEAD > .proof/source-sha.txt
          node --import ./scripts/tsx.mjs scripts/ci-run-node-test-shard.mts 2>&1 | tee .proof/group.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: zsh-current-${{ matrix.group }}
          path: .proof/
          include-hidden-files: true
  classification:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.21.0'
          install-bun: 'false'
          cache-mode: restore
      - name: Read canonical CI failure classification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .proof
          pnpm test:ci-failed https://github.com/openclaw/openclaw/actions/runs/39200242910 --repo openclaw/openclaw --json > .proof/classification.json 2> .proof/classification.stderr
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: zsh-current-classification
          path: .proof/
          include-hidden-files: true
