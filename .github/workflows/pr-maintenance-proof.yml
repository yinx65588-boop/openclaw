name: Sandbox skill catalog shipped Docker proof
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=8192
jobs:
  shipped:
    if: github.repository == 'yinx65588-boop/openclaw'
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, repaired]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: db664c77e82fa3ed02cea1557ab590ab6a27fd5d
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.22.1'
          install-bun: 'false'
          cache-mode: restore
      - name: Apply frozen candidate only to repaired matrix
        run: |
          mkdir -p .proof
          echo '' | base64 --decode > .proof/input.patch
          echo '' | base64 --decode > .proof/cli.py
          if [ "$VARIANT" = repaired ]; then
            git apply .proof/input.patch
            git add -N src/agents/sandbox/skill-catalog.ts
            node scripts/run-format.mts --write src/agents/cli-runner.ts src/agents/embedded-agent-runner/direct-compaction.ts src/agents/embedded-agent-runner/run/attempt.ts src/agents/embedded-agent-runner/run/run-attempt-dispatch.owner.test.ts src/agents/embedded-agent-runner/run/run-attempt-dispatch.ts src/agents/embedded-agent-runner/sandbox-skills.ts src/agents/sandbox-agent-config.agent-specific-sandbox-config.e2e.test.ts src/agents/sandbox.context.github-identity.test.ts src/agents/sandbox.resolveSandboxContext.test.ts src/agents/sandbox/context.browser-state-owner.test.ts src/agents/sandbox/context.state-owner.test.ts src/agents/sandbox/context.ts src/agents/sandbox/runtime-reservation.test.ts src/agents/sandbox/skill-catalog.ts src/skills/loading/workspace-skill-sync.runtime.test.ts src/skills/loading/workspace-skill-sync.runtime.ts
          fi
          git diff --binary > .proof/tested.patch
          git diff --check
          cat > .proof/netproof.sh <<'SH'
          set -euo pipefail
          mount --make-rprivate /
          ip link set lo up
          test -z "$(ip -4 route show default)"
          test -z "$(ip -6 route show default)"
          python3 .proof/cli.py
          SH
      - name: Build actual CLI and load isolated Docker image
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee .proof/build.log
          docker pull alpine:3.22
          docker image inspect alpine:3.22 > .proof/docker-image.json
      - name: Real Gateway, concurrent agents and Docker tool reads
        run: |
          set -o pipefail
          sudo env -i "PATH=$PATH" "COREPACK_HOME=$COREPACK_HOME" "NODE_OPTIONS=$NODE_OPTIONS" "PROOF_ROOT=$PWD/.proof/cli" "PROOF_DOCKER_IMAGE=alpine:3.22" "VARIANT=$VARIANT" unshare --mount --net --fork bash .proof/netproof.sh 2>&1 | tee .proof/cli.log
      - name: Make controlled evidence readable
        if: always()
        run: |
          mkdir -p .proof/published
          for file in .proof/cli/*.log .proof/cli/result.json; do
            if sudo test -f "$file"; then sudo install -m 0644 "$file" ".proof/published/$(basename "$file")"; fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: sandbox-skills-shipped-${{ matrix.variant }}
          path: |
            .proof/published/
            .proof/build.log
            .proof/cli.log
            .proof/cli.py
            .proof/input.patch
            .proof/tested.patch
            .proof/docker-image.json
          include-hidden-files: true
