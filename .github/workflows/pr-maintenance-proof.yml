name: Session token docs contracts and anchor comparison
on:
  push:
    branches: [proof/session-token-docs-followup-20261104]
permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=8192
  OPENCLAW_VITEST_RUNTIME: bun
jobs:
  contracts:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 64b00dd6dd9d9a156f2c11049822c3884bd3b25d
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.22.1'
          install-bun: 'false'
          cache-mode: restore
          semantic-checks: 'true'
      - uses: ./.github/actions/setup-test-bun
      - name: Preserve unchanged-source anchor findings and original exit
        shell: bash
        run: |
          mkdir -p .proof
          set +e
          pnpm docs:check-links:anchors > .proof/anchors-baseline.log 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > .proof/anchors-baseline.exit
          cat .proof/anchors-baseline.log
      - name: Apply the frozen formatted documentation patch
        run: |
          printf '%s' '' | base64 -d > .proof/candidate.patch
          git apply --index .proof/candidate.patch
          git diff HEAD --binary > .proof/tested.patch
          sha256sum docs/cli/sessions.md docs/reference/session-management-compaction/schema.md > .proof/source-hashes.txt
      - name: Verify new anchors add no inherited-error changes
        shell: bash
        run: |
          set +e
          pnpm docs:check-links:anchors > .proof/anchors-candidate.log 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > .proof/anchors-candidate.exit
          cat .proof/anchors-candidate.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('.proof')
          before = (root/'anchors-baseline.log').read_text()
          after = (root/'anchors-candidate.log').read_text()
          before_exit = (root/'anchors-baseline.exit').read_text().strip()
          after_exit = (root/'anchors-candidate.exit').read_text().strip()
          assert before_exit == after_exit == '1', (before_exit,after_exit)
          before_checked = int(re.search(r'checked_internal_links=(\d+)',before)[1])
          after_checked = int(re.search(r'checked_internal_links=(\d+)',after)[1])
          assert after_checked == before_checked + 2, (before_checked,after_checked)
          normalize = lambda text: re.sub(r'checked_internal_links=\d+', 'checked_internal_links=<count>', text)
          assert normalize(before) == normalize(after), 'Anchor findings changed; inspect both raw outputs'
          print(f'Baseline and candidate retain identical findings and original exits; {after_checked-before_checked} new links checked without new errors.')
          PY
      - name: Validate changed-document glossary coverage against the explicit base
        shell: bash
        run: |
          set -o pipefail
          node --import ./scripts/tsx.mjs scripts/check-docs-i18n-glossary.mts --base 64b00dd6dd9d9a156f2c11049822c3884bd3b25d 2>&1 | tee .proof/glossary.log
      - name: Existing accounting, context validity and sessions JSON contracts
        if: always()
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-vitest.mjs src/commands/sessions.test.ts src/auto-reply/reply/session-usage.test.ts src/config/sessions/context-token-provenance.test.ts --maxWorkers=1 2>&1 | tee .proof/contracts.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: session-token-docs-followup-20261104
          path: .proof/
          include-hidden-files: true
