name: Apple usage Swift lint and format
on:
  push:
    branches: [proof/apple-usage-static-20261104]
permissions:
  contents: read
jobs:
  swift:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0441c26acbe9fb871309be7b66d5cb11dd3b84a6
          persist-credentials: false
      - name: Check the four changed Swift files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .proof
          printf '%s' '' | base64 -D > .proof/tested.patch
          git apply --index .proof/tested.patch
          git diff --check HEAD
          scripts/install-swift-tools.sh "$RUNNER_TEMP/openclaw-swift-tools"
          export PATH="$RUNNER_TEMP/openclaw-swift-tools:$PATH"
          scripts/check-swift-tools.sh
          ios=(apps/ios/Sources/Design/AgentProModels.swift apps/ios/Tests/CostUsageRequestTests.swift)
          mac=(apps/macos/Sources/OpenClaw/UsageCostData.swift apps/macos/Tests/OpenClawIPCTests/UsageCostDataTests.swift)
          swiftformat --lint --config config/swiftformat "${ios[@]}" "${mac[@]}" 2>&1 | tee .proof/format.log
          swiftlint lint --strict --config config/swiftlint.yml "${mac[@]}" 2>&1 | tee .proof/macos-lint.log
          (cd apps/ios && swiftlint lint --strict --config .swiftlint.yml Sources/Design/AgentProModels.swift Tests/CostUsageRequestTests.swift) 2>&1 | tee .proof/ios-lint.log
          shasum -a 256 "${ios[@]}" "${mac[@]}" > .proof/source-hashes.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: apple-usage-static-20261104
          path: .proof/
          include-hidden-files: true
