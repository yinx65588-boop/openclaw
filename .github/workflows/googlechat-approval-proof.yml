name: Google Chat plugin approval focused static proof
on:
  push:
    branches: [proof/googlechat-static-98518]
  workflow_dispatch:
permissions:
  contents: read
env:
  OPENCLAW_VITEST_RUNTIME: node
  NODE_OPTIONS: --max-old-space-size=6144
  PROOF_BASE: ec90dc1ef23dd9c9dd731479b4431d9b082b78d5
jobs:
  static:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.21.0'
          install-bun: 'false'
          cache-mode: read-write
      - name: Prepare changed source inventory
        run: |
          mkdir -p .proof
          git diff --name-only "$PROOF_BASE" HEAD -- src extensions > .proof/changed-paths.txt
          git update-ref refs/remotes/origin/main "$PROOF_BASE"
          pnpm docs:list > .proof/docs-index.log
      - name: Production types
        if: ${{ !cancelled() }}
        run: pnpm tsgo:core > .proof/types-core.log 2>&1
      - name: Changed test owner types
        if: ${{ !cancelled() }}
        run: node scripts/run-tsgo-core-test-shards.mjs --changed-paths-json '["src/plugin-sdk/approval-native-helpers.test.ts","src/auto-reply/reply/dispatch-from-config.lifecycle.test.ts"]' > .proof/types-test.log 2>&1
      - name: Extension types
        if: ${{ !cancelled() }}
        run: pnpm tsgo:extensions > .proof/types-extensions.log 2>&1
      - name: Extension test types
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          fs.writeFileSync('.proof/tsconfig.googlechat-tests.json',JSON.stringify({
            extends:'../test/tsconfig/tsconfig.extensions.test.json',
            compilerOptions:{tsBuildInfoFile:'../.artifacts/tsgo-cache/googlechat-tests.tsbuildinfo'},
            include:['../test/types/vitest-codex-attempt-runtime.d.ts','../src/**/*.d.ts','../ui/**/*.d.ts','../extensions/**/*.d.ts','../packages/**/*.d.ts','../extensions/googlechat/src/approval-card-actions.test.ts','../extensions/googlechat/src/approval-handler.runtime.test.ts']
          }));
          JS
          node scripts/run-tsgo.mjs -p .proof/tsconfig.googlechat-tests.json --incremental > .proof/types-extension-tests.log 2>&1
      - name: Changed file owner lint and formatting
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          node --import ./scripts/tsx.mjs --input-type=module <<'JS' > .proof/lint.log 2>&1
          import fs from 'node:fs';
          import {detectChangedLanes} from './scripts/changed-lanes.mts';
          import {runChangedCheck} from './scripts/check-changed.mts';
          const paths = fs.readFileSync('.proof/changed-paths.txt','utf8').trim().split('\n');
          process.exitCode = await runChangedCheck(detectChangedLanes(paths), {lintOnly:true,base:process.env.PROOF_BASE});
          JS
          cat .proof/lint.log
      - name: Formatting correction artifact
        if: ${{ !cancelled() }}
        run: |
          xargs pnpm exec oxfmt --write --threads=1 < .proof/changed-paths.txt > .proof/format.log 2>&1
          git diff --binary > .proof/format.patch
          git diff --exit-code
      - name: Shared channel contracts
        if: ${{ !cancelled() }}
        run: pnpm test:contracts:channels > .proof/contracts.log 2>&1
      - name: Upload static evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: googlechat-static-proof
          path: .proof/
          include-hidden-files: true
