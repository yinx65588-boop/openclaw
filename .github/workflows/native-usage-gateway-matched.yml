name: Native Usage standalone Gateway preflight
on: push
permissions:
  contents: read
jobs:
  gateway:
    if: github.repository == 'yinx65588-boop/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f7082435226fb194b8bf647e5bec50e9e3b16c40
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.22.1'
          install-bun: 'false'
          cache-mode: restore
          semantic-checks: 'true'
      - name: Build the matching Gateway
        env:
          OPENCLAW_RUN_NODE_SKIP_DTS_BUILD: "1"
        run: |
          pnpm build
          node -e 'if (require("./dist/build-info.json").commit !== "f7082435226fb194b8bf647e5bec50e9e3b16c40") process.exit(1)'
      - name: Check the published Gateway and seeded costs
        run: |
          set -euo pipefail
          cat > scripts/native-usage-gateway-proof.mts <<'TS'
          import assert from "node:assert/strict";
          import { spawn } from "node:child_process";
          import path from "node:path";
          import { setTimeout as sleep } from "node:timers/promises";
          import { once } from "node:events";
          import { replaceSessionEntrySync, persistSessionTranscriptTurn } from "../src/config/sessions/session-accessor.js";
          import { callGateway } from "../src/gateway/call.js";
          import { createOpenClawTestInstance } from "../test/helpers/openclaw-test-instance.js";

          const root = process.env.RUNNER_TEMP!;
          const proof = path.join(root, "native-usage-proof");
          const packageDir = process.cwd();
          const fixture = await createOpenClawTestInstance({
            name: "native-macos-usage",
            cwd: packageDir,
            entrypoint: [path.join(packageDir, "openclaw.mjs")],
            reserveIdlePort: false,
            env: { OPENCLAW_TEST_MINIMAL_GATEWAY: "0" },
            config: { agents: { ownership: "explicit", entries: { alpha: {}, beta: {} } } },
          });
          let child: ReturnType<typeof spawn> | undefined;
          let stderr = "";
          try {
            process.env.OPENCLAW_STATE_DIR = fixture.stateDir;
            process.env.OPENCLAW_CONFIG_PATH = fixture.configPath;
            const now = Date.now();
            for (const [agentId, cost] of [["alpha", 1.25], ["beta", 2.5]] as const) {
              const sessionId = `usage-proof-${agentId}`;
              const target = { agentId, sessionKey: `agent:${agentId}:usage-proof`, sessionId };
              replaceSessionEntrySync(target, { sessionId, updatedAt: now });
              await persistSessionTranscriptTurn(target, {
                cwd: fixture.homeDir,
                updateMode: "none",
                messages: [{ now, message: {
                  role: "assistant",
                  content: [{ type: "text", text: "Synthetic usage proof." }],
                  api: "openai-responses", provider: "fixture", model: "usage-model", stopReason: "stop",
                  timestamp: now,
                  usage: { input: 10, output: 0, cacheRead: 0, cacheWrite: 0, totalTokens: 10,
                    cost: { input: cost, output: 0, cacheRead: 0, cacheWrite: 0, total: cost } },
                } }],
              });
            }
            const { cleanupSessionStateForTest } = await import("../src/test-utils/session-state-cleanup.js");
            await cleanupSessionStateForTest({ stateDir: fixture.stateDir, rootPath: fixture.state.root });
            child = spawn(process.execPath, [path.join(packageDir, "openclaw.mjs"), "gateway", "run",
              "--port", String(fixture.port), "--bind", "loopback", "--allow-unconfigured"], {
              cwd: packageDir, env: fixture.env, stdio: ["ignore", "pipe", "pipe"],
            });
            for (const stream of [child.stdout, child.stderr]) stream?.on("data", (chunk) => {
              stderr = (stderr + chunk).slice(-18000);
            });
            let ready = false;
            for (let attempt = 0; attempt < 120 && child.exitCode === null; attempt++) {
              const response = await fetch(fixture.url.replace("ws:", "http:") + "/readyz",
                { signal: AbortSignal.timeout(1500) }).catch(() => undefined);
              if (response?.ok) { ready = true; break; }
              await sleep(1000);
            }
            assert(ready, `Gateway startup failed (exit=${child.exitCode})`);
            const gateway = {
              config: {}, configPath: fixture.configPath, url: fixture.url,
              token: fixture.gatewayToken, ignoreEnvUrlOverride: true, deviceIdentity: null,
              sharedStateMode: "read-only" as const, timeoutMs: 30000,
            };
            const usage = await callGateway<{ totals: { totalCost: number } }>({
              ...gateway, method: "usage.cost", params: { agentScope: "all" },
            });
            assert.equal(usage.totals.totalCost, 3.75);
            await assert.rejects(callGateway({ ...gateway, method: "usage.cost", params: {} }), /no explicit owner|select an agent explicitly/i);
            console.log("Gateway controls passed: alpha $1.25 + beta $2.50 = $3.75; unscoped rejected");
            const setup = await callGateway<{ setupCode: string }>({
              ...gateway, method: "device.pair.setupCode", params: { publicUrl: fixture.url, includeQr: false },
            });
            assert(setup.setupCode);
            console.log("Setup-code RPC succeeded; no credential included");
          } catch (error) {
            const redact = (text: string) => text.replaceAll(fixture.gatewayToken, "<redacted>")
              .replaceAll(fixture.hookToken, "<redacted>").replaceAll(fixture.url, "<loopback>");
            console.error(redact(String(error)));
            console.error(redact(stderr));
            process.exitCode = 1;
          } finally {
            if (child && child.exitCode === null && child.signalCode === null) {
              const exit = once(child, "exit");
              child.kill("SIGTERM");
              const timer = setTimeout(() => child?.kill("SIGKILL"), 8000);
              await exit;
              clearTimeout(timer);
            }
            await fixture.cleanup();
          }
          TS
          node --import ./scripts/tsx.mjs scripts/native-usage-gateway-proof.mts
